          "content": { "application/json": { "schema": { "$ref": "#/components/schemas/TextChannelArchiveRequest" } } }
        },
        "responses": {
          "200": { "description": "Text channel moved to archive state", "content": { "application/json": { "schema": { "$ref": "#/components/schemas/ArchivedChannel" } } } },
          "400": { "description": "Explicit archive confirmation absent", "content": { "application/json": { "schema": { "$ref": "#/components/schemas/Error" } } } },
          "401": { "description": "No valid active session", "content": { "application/json": { "schema": { "$ref": "#/components/schemas/Error" } } } },
          "403": { "description": "Administrator role required", "content": { "application/json": { "schema": { "$ref": "#/components/schemas/Error" } } } },
          "409": { "description": "Revision mismatch, channel absent, already archived or not TEXT", "content": { "application/json": { "schema": { "$ref": "#/components/schemas/Error" } } } },
          "500": { "description": "Internal error", "content": { "application/json": { "schema": { "$ref": "#/components/schemas/Error" } } } }
        }
      }
    },
    "/api/v1/admin/voice-channels/{channelID}/close-admission": {
      "post": {
        "operationId": "closeVoiceChannelAdmission",
        "description": "Administrator-only. Closes future logical admission for an active VOICE channel, revokes its active voice leases and creates a durable SFU revocation for each. A bounded worker archives the channel only after confirmed SFU removal, no active lease and an empty exact LiveKit room; real connected-media and old-token behavior remain POC-03 gates.",
        "parameters": [
          { "name": "channelID", "in": "path", "required": true, "schema": { "type": "string", "format": "uuid" } }
        ],
        "requestBody": {
          "required": true,
          "content": { "application/json": { "schema": { "$ref": "#/components/schemas/TopologyRevisionRequest" } } }
        },
        "responses": {
          "200": { "description": "Voice admission closed and active logical leases revoked", "content": { "application/json": { "schema": { "$ref": "#/components/schemas/VoiceAdmissionClosed" } } } },
          "400": { "description": "Malformed revision", "content": { "application/json": { "schema": { "$ref": "#/components/schemas/Error" } } } },
          "401": { "description": "No valid active session", "content": { "application/json": { "schema": { "$ref": "#/components/schemas/Error" } } } },
          "403": { "description": "Administrator role required", "content": { "application/json": { "schema": { "$ref": "#/components/schemas/Error" } } } },
          "409": { "description": "Revision mismatch, channel absent, not VOICE or admission already closed", "content": { "application/json": { "schema": { "$ref": "#/components/schemas/Error" } } } },
          "500": { "description": "Internal error", "content": { "application/json": { "schema": { "$ref": "#/components/schemas/Error" } } } }
        }
      }
    }
  },
