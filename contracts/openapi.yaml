          },
          "400": { "description": "Malformed request", "content": { "application/json": { "schema": { "$ref": "#/components/schemas/Error" } } } },
          "401": { "description": "Invalid credentials", "content": { "application/json": { "schema": { "$ref": "#/components/schemas/Error" } } } },
          "403": { "description": "Blocked account", "content": { "application/json": { "schema": { "$ref": "#/components/schemas/Error" } } } },
          "500": { "description": "Internal error", "content": { "application/json": { "schema": { "$ref": "#/components/schemas/Error" } } } }
        }
      }
    },
    "/api/v1/auth/logout": {
      "post": {
        "operationId": "logout",
        "responses": {
          "204": {
            "description": "Current session is revoked when present and the session cookie is cleared",
            "headers": {
              "Set-Cookie": { "description": "Expired opaque session cookie", "schema": { "type": "string" } }
            }
          },
          "500": { "description": "Session revocation failure", "content": { "application/json": { "schema": { "$ref": "#/components/schemas/Error" } } } }
        }
      }
    },
    "/api/v1/auth/session": {
      "get": {
        "operationId": "getCurrentSession",
        "responses": {
          "200": { "description": "Authenticated current principal", "content": { "application/json": { "schema": { "$ref": "#/components/schemas/Principal" } } } },
          "401": { "description": "No valid active session", "content": { "application/json": { "schema": { "$ref": "#/components/schemas/Error" } } } },
          "500": { "description": "Internal error", "content": { "application/json": { "schema": { "$ref": "#/components/schemas/Error" } } } }
        }
      }
    },
    "/api/v1/me": {
      "get": {
        "operationId": "getMe",
        "description": "Authenticated caller only. Returns the caller's own stable login, display name and fixed role; never accepts another account identifier.",
        "responses": {
          "200": { "description": "Current account profile", "content": { "application/json": { "schema": { "$ref": "#/components/schemas/OwnProfile" } } } },
          "401": { "description": "No valid active session", "content": { "application/json": { "schema": { "$ref": "#/components/schemas/Error" } } } },
          "404": { "description": "Current profile is unavailable", "content": { "application/json": { "schema": { "$ref": "#/components/schemas/Error" } } } },
          "500": { "description": "Internal error", "content": { "application/json": { "schema": { "$ref": "#/components/schemas/Error" } } } }
        }
      },
      "patch": {
        "operationId": "updateMe",
        "description": "Authenticated caller only. Updates display_name for the caller derived from the server-side session; login and role are immutable through this operation.",
        "requestBody": {
          "required": true,
          "content": { "application/json": { "schema": { "$ref": "#/components/schemas/OwnProfileUpdateRequest" } } }
