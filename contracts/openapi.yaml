{
  "openapi": "3.1.1",
  "info": {
    "title": "Voice Platform API",
    "version": "1.0.0-draft",
    "description": "Versioned foundation contract. Feature endpoints are added only with matching ACL and contract tests."
  },
  "paths": {
    "/api/v1/health": {
      "get": {
        "operationId": "getHealth",
        "responses": {
          "200": {
            "description": "API process is live",
            "content": {
              "application/json": {
                "schema": { "$ref": "#/components/schemas/Health" }
              }
            }
          }
        }
      }
    },
    "/api/v1/maintenance": {
      "get": {
        "operationId": "getMaintenanceAdmission",
        "description": "Public, metadata-only deployment admission state. It reveals no schedule, operator identity, deployment internals or session data.",
        "responses": {
          "200": { "description": "Current new-admission state", "content": { "application/json": { "schema": { "$ref": "#/components/schemas/MaintenanceStatus" } } } },
          "503": { "description": "Maintenance state is temporarily unavailable", "content": { "application/json": { "schema": { "$ref": "#/components/schemas/Error" } } } }
        }
      }
    },
    "/api/v1/realtime": {
      "get": {
        "operationId": "connectRealtime",
        "description": "Authenticated same-origin WebSocket upgrade. The optional after UUID is the last acknowledged durable event_id. The journal has 7-day retention and a 512-event replay limit; the server rechecks current session and per-event ACL. A cursor from another server boot epoch, an expired/invalid cursor, overflow or unavailable journal causes connection.resync_required and REST full resync. Replayed events can duplicate live delivery, so the client deduplicates by event_id. Presence and connection events are ephemeral and must not be used as after cursors.",
        "parameters": [
          { "name": "after", "in": "query", "required": false, "schema": { "type": "string", "format": "uuid" }, "description": "Last acknowledged durable event_id; never an authentication token." }
        ],
        "responses": {
          "101": { "description": "WebSocket upgrade; frames follow realtime.schema.json" },
          "401": { "description": "No active server-side session", "content": { "application/json": { "schema": { "$ref": "#/components/schemas/Error" } } } }
        }
      }
    },
    "/api/v1/telemetry/traces": {
      "post": {
        "operationId": "ingestClientTraces",
        "description": "Authenticated same-origin OTLP protobuf relay. The server accepts at most 256 KiB and 32 fixed-name spans, strips all client attributes, events, links and resource fields, then forwards metadata-only traces with a server-side collector credential. The client never receives that credential.",
        "parameters": [
          { "name": "X-Client-Platform", "in": "header", "required": true, "schema": { "type": "string", "enum": ["web", "android", "ios", "windows", "macos"] } }
        ],
        "requestBody": { "required": true, "content": { "application/x-protobuf": { "schema": { "type": "string", "format": "binary", "maxLength": 262144 } } } },
        "responses": {
          "202": { "description": "Metadata-only spans accepted by collector" },
          "400": { "description": "Invalid OTLP batch or operation name" },
          "401": { "description": "No active server-side session" },
          "413": { "description": "OTLP batch exceeds size limit" },
          "415": { "description": "OTLP protobuf content type required" },
          "429": { "description": "Telemetry rate limit exceeded" },
          "503": { "description": "Collector unavailable or not configured" }
        }
      }
    },
    "/api/v1/direct-messages": {
      "post": {
        "operationId": "openDirectMessage",
        "description": "Authenticated account only. Opens the single canonical direct-message pair when both accounts are active; administrator status never grants access to a third account's DM.",
        "requestBody": {
          "required": true,
          "content": { "application/json": { "schema": { "$ref": "#/components/schemas/DirectMessageOpenRequest" } } }
        },
        "responses": {
          "201": { "description": "New or existing canonical pair", "content": { "application/json": { "schema": { "$ref": "#/components/schemas/DirectMessage" } } } },
          "400": { "description": "Malformed or self participant", "content": { "application/json": { "schema": { "$ref": "#/components/schemas/Error" } } } },
          "401": { "description": "No active server-side session", "content": { "application/json": { "schema": { "$ref": "#/components/schemas/Error" } } } },
          "404": { "description": "Other account is absent or blocked", "content": { "application/json": { "schema": { "$ref": "#/components/schemas/Error" } } } },
          "500": { "description": "Internal error", "content": { "application/json": { "schema": { "$ref": "#/components/schemas/Error" } } } }
        }
      },
      "get": {
        "operationId": "listDirectMessages",
        "description": "Authenticated caller only. Returns canonical DM pairs containing caller, paired account display name, caller-local unread_count, mention_count and optional first_unread_message_id derived from the monotonic cursor and current live messages; administrator role grants no exception. A pre-existing pair remains visible to reach retained history after a block.",
        "responses": {
          "200": { "description": "Caller direct-message navigation list", "content": { "application/json": { "schema": { "$ref": "#/components/schemas/DirectMessageList" } } } },
          "401": { "description": "No active server-side session", "content": { "application/json": { "schema": { "$ref": "#/components/schemas/Error" } } } },
          "500": { "description": "Internal error", "content": { "application/json": { "schema": { "$ref": "#/components/schemas/Error" } } } }
        }
      }
    },
    "/api/v1/direct-message-candidates": {
      "get": {
        "operationId": "listDirectMessageCandidates",
        "description": "Authenticated caller only. Returns a bounded, stable page of other non-blocked deployment accounts that may be selected to open a direct message. It exposes no login, role or block state; POST /direct-messages remains the atomic participant check and canonical-pair creation command.",
        "parameters": [
          { "name": "after", "in": "query", "required": false, "schema": { "type": "string", "format": "uuid" } },
          { "name": "limit", "in": "query", "required": false, "schema": { "type": "integer", "minimum": 1, "maximum": 100, "default": 50 } }
        ],
        "responses": {
          "200": { "description": "Caller-scoped direct-message candidate page", "content": { "application/json": { "schema": { "$ref": "#/components/schemas/DirectMessageCandidateList" } } } },
          "400": { "description": "Malformed cursor or limit", "content": { "application/json": { "schema": { "$ref": "#/components/schemas/Error" } } } },
          "401": { "description": "No active server-side session", "content": { "application/json": { "schema": { "$ref": "#/components/schemas/Error" } } } },
          "500": { "description": "Internal error", "content": { "application/json": { "schema": { "$ref": "#/components/schemas/Error" } } } }
        }
      }
    },
    "/api/v1/direct-messages/{directMessageID}/attachments": {
      "post": {
        "operationId": "uploadDirectMessageAttachment",
        "description": "Authenticated participant only. Streams one file to private staging for this canonical DM pair while both participants are active; administrator status grants no exception. The response contains metadata only, never a storage key or download URL.",
        "parameters": [
          { "name": "directMessageID", "in": "path", "required": true, "schema": { "type": "string", "format": "uuid" } }
        ],
        "requestBody": {
          "required": true,
          "content": { "multipart/form-data": { "schema": { "type": "object", "additionalProperties": false, "required": ["file"], "properties": { "file": { "type": "string", "format": "binary" } } } } }
        },
        "responses": {
          "201": { "description": "Private unattached attachment metadata", "content": { "application/json": { "schema": { "$ref": "#/components/schemas/AttachmentUpload" } } } },
          "400": { "description": "Malformed multipart body", "content": { "application/json": { "schema": { "$ref": "#/components/schemas/Error" } } } },
          "401": { "description": "No active server-side session", "content": { "application/json": { "schema": { "$ref": "#/components/schemas/Error" } } } },
          "404": { "description": "DM is absent, caller is not a participant, or either account is blocked", "content": { "application/json": { "schema": { "$ref": "#/components/schemas/Error" } } } },
          "413": { "description": "File exceeds 25,000,000 bytes", "content": { "application/json": { "schema": { "$ref": "#/components/schemas/Error" } } } },
          "507": { "description": "Insufficient private attachment storage", "content": { "application/json": { "schema": { "$ref": "#/components/schemas/Error" } } } }
        }
      }
    },
    "/api/v1/direct-messages/{directMessageID}/attachments/{attachmentID}": {
      "get": {
        "operationId": "downloadDirectMessageAttachment",
        "description": "Authenticated participant of this canonical pair only; administrator status grants no exception. Before each private file read, require an ATTACHED object linked to a live message in this DM. Serve all formats as forced downloads with nosniff, never a storage key or public URL.",
        "parameters": [
          { "name": "directMessageID", "in": "path", "required": true, "schema": { "type": "string", "format": "uuid" } },
          { "name": "attachmentID", "in": "path", "required": true, "schema": { "type": "string", "format": "uuid" } }
        ],
        "responses": {
          "200": {
            "description": "Private bytes with forced attachment disposition and nosniff",
            "headers": {
              "Content-Disposition": { "schema": { "type": "string" } },
              "Cache-Control": { "schema": { "type": "string", "enum": ["no-store"] } },
              "X-Content-Type-Options": { "schema": { "type": "string", "enum": ["nosniff"] } }
            },
            "content": { "application/octet-stream": { "schema": { "type": "string", "format": "binary" } } }
          },
          "400": { "description": "Malformed identifier", "content": { "application/json": { "schema": { "$ref": "#/components/schemas/Error" } } } },
          "401": { "description": "No active server-side session", "content": { "application/json": { "schema": { "$ref": "#/components/schemas/Error" } } } },
          "404": { "description": "Attachment, live DM message or participant access is unavailable", "content": { "application/json": { "schema": { "$ref": "#/components/schemas/Error" } } } },
          "500": { "description": "Private attachment could not be read", "content": { "application/json": { "schema": { "$ref": "#/components/schemas/Error" } } } }
        }
      }
    },
    "/api/v1/direct-messages/{directMessageID}/attachments/{attachmentID}/preview": {
      "get": {
        "operationId": "previewDirectMessageAttachment",
        "description": "Same participant and live-message checks as private DM download. Only valid bounded PNG/JPEG/GIF sources become a server-normalized PNG; active, corrupt, oversized, deleted or unauthorized content is unavailable and never rendered on the application origin.",
        "parameters": [
          { "name": "directMessageID", "in": "path", "required": true, "schema": { "type": "string", "format": "uuid" } },
          { "name": "attachmentID", "in": "path", "required": true, "schema": { "type": "string", "format": "uuid" } }
        ],
        "responses": {
          "200": {
            "description": "Private server-normalized PNG preview",
            "headers": {
              "Cache-Control": { "schema": { "type": "string", "enum": ["no-store"] } },
              "X-Content-Type-Options": { "schema": { "type": "string", "enum": ["nosniff"] } }
            },
            "content": { "image/png": { "schema": { "type": "string", "format": "binary" } } }
          },
          "400": { "description": "Malformed identifier", "content": { "application/json": { "schema": { "$ref": "#/components/schemas/Error" } } } },
          "401": { "description": "No active server-side session", "content": { "application/json": { "schema": { "$ref": "#/components/schemas/Error" } } } },
          "404": { "description": "Attachment, live DM message, participant access or safe preview is unavailable", "content": { "application/json": { "schema": { "$ref": "#/components/schemas/Error" } } } },
          "500": { "description": "Preview could not be rendered", "content": { "application/json": { "schema": { "$ref": "#/components/schemas/Error" } } } }
        }
      }
    },
    "/api/v1/direct-messages/{directMessageID}/messages": {
      "post": {
        "operationId": "sendDirectMessage",
        "description": "Authenticated participant only. The caller must belong to this DM and both participants must be active; administrator role supplies no exception. Up to ten private attachment_ids must belong to the caller and this DM, and bind atomically to the new message. Reusing the same author-and-DM-scoped client_message_id returns the existing message without adding links.",
        "parameters": [
          { "name": "directMessageID", "in": "path", "required": true, "schema": { "type": "string", "format": "uuid" } }
        ],
        "requestBody": {
          "required": true,
          "content": { "application/json": { "schema": { "$ref": "#/components/schemas/DirectMessageMessageCreateRequest" } } }
        },
        "responses": {
          "201": { "description": "Message created or idempotently returned", "content": { "application/json": { "schema": { "$ref": "#/components/schemas/DirectMessageMessage" } } } },
          "400": { "description": "Malformed or oversized message", "content": { "application/json": { "schema": { "$ref": "#/components/schemas/Error" } } } },
          "401": { "description": "No active server-side session", "content": { "application/json": { "schema": { "$ref": "#/components/schemas/Error" } } } },
          "404": { "description": "DM is absent, caller is not a participant, or either account is blocked", "content": { "application/json": { "schema": { "$ref": "#/components/schemas/Error" } } } },
          "500": { "description": "Internal error", "content": { "application/json": { "schema": { "$ref": "#/components/schemas/Error" } } } }
        }
      },
      "get": {
        "operationId": "listDirectMessageHistory",
        "description": "Authenticated DM participant only. Administrator role grants no exception. Returns newest-first cursor pages and retains history for the other participant after a block. The at anchor returns that message (including its deleted marker) and a bounded older page; an absent or foreign anchor returns an empty page. at and before are mutually exclusive.",
        "parameters": [
          { "name": "directMessageID", "in": "path", "required": true, "schema": { "type": "string", "format": "uuid" } },
          { "name": "before", "in": "query", "required": false, "schema": { "type": "string", "format": "uuid" } },
          { "name": "at", "in": "query", "required": false, "schema": { "type": "string", "format": "uuid" } },
          { "name": "limit", "in": "query", "required": false, "schema": { "type": "integer", "minimum": 1, "maximum": 100, "default": 50 } }
        ],
        "responses": {
          "200": { "description": "Newest-first direct-message history page", "content": { "application/json": { "schema": { "$ref": "#/components/schemas/DirectMessageMessagePage" } } } },
          "400": { "description": "Malformed cursor or limit", "content": { "application/json": { "schema": { "$ref": "#/components/schemas/Error" } } } },
          "401": { "description": "No active server-side session", "content": { "application/json": { "schema": { "$ref": "#/components/schemas/Error" } } } },
          "404": { "description": "DM is absent or caller is not a participant", "content": { "application/json": { "schema": { "$ref": "#/components/schemas/Error" } } } },
          "500": { "description": "Internal error", "content": { "application/json": { "schema": { "$ref": "#/components/schemas/Error" } } } }
        }
      }
    },
    "/api/v1/direct-messages/{directMessageID}/search": {
      "get": {
        "operationId": "searchDirectMessageHistory",
        "description": "Authenticated DM participant only. Searches non-deleted message text in the caller's selected canonical pair with PostgreSQL simple full-text search; administrator role grants no exception.",
        "parameters": [
          { "name": "directMessageID", "in": "path", "required": true, "schema": { "type": "string", "format": "uuid" } },
          { "name": "query", "in": "query", "required": true, "schema": { "type": "string", "minLength": 1, "maxLength": 256 } },
          { "name": "before", "in": "query", "required": false, "schema": { "type": "string", "format": "uuid" } },
          { "name": "limit", "in": "query", "required": false, "schema": { "type": "integer", "minimum": 1, "maximum": 100, "default": 50 } }
        ],
        "responses": {
          "200": { "description": "Newest-first matching message page", "content": { "application/json": { "schema": { "$ref": "#/components/schemas/DirectMessageSearchPage" } } } },
          "400": { "description": "Malformed query or page", "content": { "application/json": { "schema": { "$ref": "#/components/schemas/Error" } } } },
          "401": { "description": "No active server-side session", "content": { "application/json": { "schema": { "$ref": "#/components/schemas/Error" } } } },
          "404": { "description": "DM is absent or caller is not a participant", "content": { "application/json": { "schema": { "$ref": "#/components/schemas/Error" } } } },
          "500": { "description": "Internal error", "content": { "application/json": { "schema": { "$ref": "#/components/schemas/Error" } } } }
        }
      }
    },
    "/api/v1/direct-messages/{directMessageID}/messages/{messageID}": {
      "patch": {
        "operationId": "editDirectMessage",
        "description": "Authenticated DM author only. Pair membership, author ID, non-deleted state, and expected revision are checked atomically; administrator role grants no exception. A conflict intentionally does not disclose which guard failed.",
        "parameters": [
          { "name": "directMessageID", "in": "path", "required": true, "schema": { "type": "string", "format": "uuid" } },
          { "name": "messageID", "in": "path", "required": true, "schema": { "type": "string", "format": "uuid" } }
        ],
        "requestBody": {
          "required": true,
          "content": { "application/json": { "schema": { "$ref": "#/components/schemas/DirectMessageMessageEditRequest" } } }
        },
        "responses": {
          "200": { "description": "Author message revised", "content": { "application/json": { "schema": { "$ref": "#/components/schemas/DirectMessageMessageEdited" } } } },
          "400": { "description": "Malformed revision or body", "content": { "application/json": { "schema": { "$ref": "#/components/schemas/Error" } } } },
          "401": { "description": "No active server-side session", "content": { "application/json": { "schema": { "$ref": "#/components/schemas/Error" } } } },
          "409": { "description": "Message is stale, deleted, unavailable, or not owned by caller; refresh history before retrying", "content": { "application/json": { "schema": { "$ref": "#/components/schemas/Error" } } } },
          "500": { "description": "Internal error", "content": { "application/json": { "schema": { "$ref": "#/components/schemas/Error" } } } }
        }
      },
      "delete": {
        "operationId": "deleteDirectMessage",
        "description": "Authenticated DM author only. Canonical-pair membership, author ID, and non-deleted state are checked atomically; administrator role grants no exception. The message row, ID, reply reference, and history remain, while body is cleared and a deletion marker with a new revision is written.",
        "parameters": [
          { "name": "directMessageID", "in": "path", "required": true, "schema": { "type": "string", "format": "uuid" } },
          { "name": "messageID", "in": "path", "required": true, "schema": { "type": "string", "format": "uuid" } }
        ],
        "responses": {
          "204": { "description": "Author message replaced with a deletion marker" },
          "400": { "description": "Malformed path identifier", "content": { "application/json": { "schema": { "$ref": "#/components/schemas/Error" } } } },
          "401": { "description": "No active server-side session", "content": { "application/json": { "schema": { "$ref": "#/components/schemas/Error" } } } },
          "404": { "description": "Message is absent, already deleted, unavailable, or not owned by caller", "content": { "application/json": { "schema": { "$ref": "#/components/schemas/Error" } } } },
          "500": { "description": "Internal error", "content": { "application/json": { "schema": { "$ref": "#/components/schemas/Error" } } } }
        }
      }
    },
    "/api/v1/direct-messages/{directMessageID}/read-cursor": {
      "put": {
        "operationId": "advanceDirectMessageReadCursor",
        "description": "Authenticated participant only. The browser sends a message actually shown in its active visible DM; the server advances only that participant's cursor monotonically and grants no administrator exception. Existing DM history remains readable after a block.",
        "parameters": [
          { "name": "directMessageID", "in": "path", "required": true, "schema": { "type": "string", "format": "uuid" } }
        ],
        "requestBody": {
          "required": true,
          "content": { "application/json": { "schema": { "$ref": "#/components/schemas/DirectMessageReadCursorRequest" } } }
        },
        "responses": {
          "200": { "description": "Effective monotonic cursor for this participant", "content": { "application/json": { "schema": { "$ref": "#/components/schemas/DirectMessageReadCursor" } } } },
          "400": { "description": "Malformed path or body", "content": { "application/json": { "schema": { "$ref": "#/components/schemas/Error" } } } },
          "401": { "description": "No active server-side session", "content": { "application/json": { "schema": { "$ref": "#/components/schemas/Error" } } } },
          "404": { "description": "DM or message is absent, or caller is not a participant", "content": { "application/json": { "schema": { "$ref": "#/components/schemas/Error" } } } },
          "500": { "description": "Internal error", "content": { "application/json": { "schema": { "$ref": "#/components/schemas/Error" } } } }
        }
      }
    },
    "/api/v1/channels": {
      "get": {
        "operationId": "getChannelTopology",
        "description": "Authenticated member only. Returns ordered categories and non-archived channels; each TEXT channel includes caller-local unread_count, mention_count and optional first_unread_message_id from current live messages after that caller's monotonic cursor, excluding their own messages. VOICE channels omit these fields; a VOICE channel with closed admission remains visible with admission_closed:true until confirmed finalization.",
        "responses": {
          "200": { "description": "Current readable channel topology", "content": { "application/json": { "schema": { "$ref": "#/components/schemas/ChannelTopology" } } } },
          "401": { "description": "No valid active session", "content": { "application/json": { "schema": { "$ref": "#/components/schemas/Error" } } } },
          "500": { "description": "Internal error", "content": { "application/json": { "schema": { "$ref": "#/components/schemas/Error" } } } }
        }
      }
    },
    "/api/v1/channels/{channelID}/read-cursor": {
      "put": {
        "operationId": "advanceTextChannelReadCursor",
        "description": "Authenticated member only. Advances only the caller's cursor to a message in the same current TEXT channel. Backward requests leave the effective cursor unchanged; an archived, wrong-kind or mismatched message is unavailable.",
        "parameters": [
          { "name": "channelID", "in": "path", "required": true, "schema": { "type": "string", "format": "uuid" } }
        ],
        "requestBody": {
          "required": true,
          "content": { "application/json": { "schema": { "$ref": "#/components/schemas/ChannelReadCursorRequest" } } }
        },
        "responses": {
          "200": { "description": "Effective monotonic cursor for this caller and channel", "content": { "application/json": { "schema": { "$ref": "#/components/schemas/ChannelReadCursor" } } } },
          "400": { "description": "Malformed path or body", "content": { "application/json": { "schema": { "$ref": "#/components/schemas/Error" } } } },
          "401": { "description": "No active server-side session", "content": { "application/json": { "schema": { "$ref": "#/components/schemas/Error" } } } },
          "404": { "description": "Channel or message is absent or unavailable to caller", "content": { "application/json": { "schema": { "$ref": "#/components/schemas/Error" } } } },
          "500": { "description": "Internal error", "content": { "application/json": { "schema": { "$ref": "#/components/schemas/Error" } } } }
        }
      }
    },
    "/api/v1/channels/{channelID}/messages": {
      "get": {
        "operationId": "listTextMessages",
        "description": "Authenticated member only. Returns newest-first cursor pages from a current TEXT channel. Deleted messages retain an ID and deleted marker but never expose their former body. The at anchor returns that message and a bounded older page; an absent or foreign anchor returns an empty page. at and before are mutually exclusive.",
        "parameters": [
          { "name": "channelID", "in": "path", "required": true, "schema": { "type": "string", "format": "uuid" } },
          { "name": "before", "in": "query", "required": false, "schema": { "type": "string", "format": "uuid" } },
          { "name": "at", "in": "query", "required": false, "schema": { "type": "string", "format": "uuid" } },
          { "name": "limit", "in": "query", "required": false, "schema": { "type": "integer", "minimum": 1, "maximum": 100, "default": 50 } }
        ],
        "responses": {
          "200": { "description": "Cursor page", "content": { "application/json": { "schema": { "$ref": "#/components/schemas/TextMessagePage" } } } },
          "400": { "description": "Malformed page", "content": { "application/json": { "schema": { "$ref": "#/components/schemas/Error" } } } },
          "401": { "description": "No active server-side session", "content": { "application/json": { "schema": { "$ref": "#/components/schemas/Error" } } } },
          "404": { "description": "Unavailable text channel", "content": { "application/json": { "schema": { "$ref": "#/components/schemas/Error" } } } },
          "500": { "description": "Internal error", "content": { "application/json": { "schema": { "$ref": "#/components/schemas/Error" } } } }
        }
      },
      "post": {
        "operationId": "createTextMessage",
        "description": "Authenticated member only. Creates or returns the same message for an author-and-channel-scoped client_message_id. The current channel must be non-archived TEXT; a reply may reference only that same channel.",
        "parameters": [
          { "name": "channelID", "in": "path", "required": true, "schema": { "type": "string", "format": "uuid" } }
        ],
        "requestBody": {
          "required": true,
          "content": { "application/json": { "schema": { "$ref": "#/components/schemas/TextMessageCreateRequest" } } }
        },
        "responses": {
          "201": { "description": "Message created or idempotently returned", "content": { "application/json": { "schema": { "$ref": "#/components/schemas/TextMessage" } } } },
          "400": { "description": "Malformed or oversized message", "content": { "application/json": { "schema": { "$ref": "#/components/schemas/Error" } } } },
          "401": { "description": "No active server-side session", "content": { "application/json": { "schema": { "$ref": "#/components/schemas/Error" } } } },
          "404": { "description": "Unavailable text channel or cross-channel reply", "content": { "application/json": { "schema": { "$ref": "#/components/schemas/Error" } } } },
          "500": { "description": "Internal error", "content": { "application/json": { "schema": { "$ref": "#/components/schemas/Error" } } } }
        }
      }
    },
    "/api/v1/channels/{channelID}/search": {
      "get": {
        "operationId": "searchTextMessages",
        "description": "Authenticated member only. Searches non-deleted text in one current TEXT channel with PostgreSQL simple full-text search. The endpoint does not search attachments, deleted bodies, or another channel.",
        "parameters": [
          { "name": "channelID", "in": "path", "required": true, "schema": { "type": "string", "format": "uuid" } },
          { "name": "query", "in": "query", "required": true, "schema": { "type": "string", "minLength": 1, "maxLength": 256 } },
          { "name": "before", "in": "query", "required": false, "schema": { "type": "string", "format": "uuid" } },
          { "name": "limit", "in": "query", "required": false, "schema": { "type": "integer", "minimum": 1, "maximum": 100, "default": 50 } }
        ],
        "responses": {
          "200": { "description": "Newest-first matching message page", "content": { "application/json": { "schema": { "$ref": "#/components/schemas/TextMessageSearchPage" } } } },
          "400": { "description": "Malformed query or page", "content": { "application/json": { "schema": { "$ref": "#/components/schemas/Error" } } } },
          "401": { "description": "No active server-side session", "content": { "application/json": { "schema": { "$ref": "#/components/schemas/Error" } } } },
          "404": { "description": "Text channel is absent, archived, or not TEXT", "content": { "application/json": { "schema": { "$ref": "#/components/schemas/Error" } } } },
          "500": { "description": "Internal error", "content": { "application/json": { "schema": { "$ref": "#/components/schemas/Error" } } } }
        }
      }
    },
    "/api/v1/search/messages": {
      "get": {
        "operationId": "searchMessages",
        "description": "Authenticated member only. Searches non-deleted text across current TEXT channels and only the caller's own DM pairs. Optional channel_id or direct_message_id restricts the current conversation; the filters are mutually exclusive. Uses PostgreSQL simple full-text search and a mixed-source cursor.",
        "parameters": [
          { "name": "query", "in": "query", "required": true, "schema": { "type": "string", "minLength": 1, "maxLength": 256 } },
          { "name": "channel_id", "in": "query", "required": false, "schema": { "type": "string", "format": "uuid" } },
          { "name": "direct_message_id", "in": "query", "required": false, "schema": { "type": "string", "format": "uuid" } },
          { "name": "before", "in": "query", "required": false, "schema": { "type": "string", "maxLength": 512 } },
          { "name": "limit", "in": "query", "required": false, "schema": { "type": "integer", "minimum": 1, "maximum": 100, "default": 50 } }
        ],
        "responses": {
          "200": { "description": "Newest-first mixed conversation page", "content": { "application/json": { "schema": { "$ref": "#/components/schemas/MessageSearchPage" } } } },
          "400": { "description": "Malformed query, filter or cursor", "content": { "application/json": { "schema": { "$ref": "#/components/schemas/Error" } } } },
          "401": { "description": "No active server-side session", "content": { "application/json": { "schema": { "$ref": "#/components/schemas/Error" } } } },
          "404": { "description": "Filtered conversation is absent or unavailable to the caller", "content": { "application/json": { "schema": { "$ref": "#/components/schemas/Error" } } } },
          "500": { "description": "Internal error", "content": { "application/json": { "schema": { "$ref": "#/components/schemas/Error" } } } }
        }
      }
    },
    "/api/v1/channels/{channelID}/attachments": {
      "post": {
        "operationId": "uploadTextAttachment",
        "description": "Authenticated active account only. Streams one file to private staging for a current TEXT channel; the server checks the target before and after staging. The response never grants a download URL or exposes a storage key.",
        "parameters": [
          { "name": "channelID", "in": "path", "required": true, "schema": { "type": "string", "format": "uuid" } }
        ],
        "requestBody": {
          "required": true,
          "content": { "multipart/form-data": { "schema": { "type": "object", "additionalProperties": false, "required": ["file"], "properties": { "file": { "type": "string", "format": "binary" } } } } }
        },
        "responses": {
          "201": { "description": "Private unattached attachment metadata", "content": { "application/json": { "schema": { "$ref": "#/components/schemas/AttachmentUpload" } } } },
          "400": { "description": "Malformed multipart body", "content": { "application/json": { "schema": { "$ref": "#/components/schemas/Error" } } } },
          "404": { "description": "Text channel is absent or unavailable", "content": { "application/json": { "schema": { "$ref": "#/components/schemas/Error" } } } },
          "413": { "description": "File exceeds 25,000,000 bytes", "content": { "application/json": { "schema": { "$ref": "#/components/schemas/Error" } } } },
          "507": { "description": "Attachment volume cannot reserve required space", "content": { "application/json": { "schema": { "$ref": "#/components/schemas/Error" } } } }
        }
      }
    },
    "/api/v1/channels/{channelID}/attachments/{attachmentID}": {
      "get": {
        "operationId": "downloadTextAttachment",
        "description": "Authenticated active account only. Before every private file read, the server verifies the current TEXT channel, an attached object linked to a non-deleted message, and the current caller. The response is always a forced binary download; it never reveals a storage key, local path, or public URL.",
        "parameters": [
          { "name": "channelID", "in": "path", "required": true, "schema": { "type": "string", "format": "uuid" } },
          { "name": "attachmentID", "in": "path", "required": true, "schema": { "type": "string", "format": "uuid" } }
        ],
        "responses": {
          "200": {
            "description": "Private attachment bytes served with attachment disposition and nosniff",
            "headers": {
              "Content-Disposition": { "schema": { "type": "string" }, "description": "Always attachment disposition; active formats are never rendered inline." },
              "Cache-Control": { "schema": { "type": "string", "enum": ["no-store"] } },
              "X-Content-Type-Options": { "schema": { "type": "string", "enum": ["nosniff"] } }
            },
            "content": { "application/octet-stream": { "schema": { "type": "string", "format": "binary" } } }
          },
          "400": { "description": "Malformed identifier", "content": { "application/json": { "schema": { "$ref": "#/components/schemas/Error" } } } },
          "401": { "description": "No active server-side session", "content": { "application/json": { "schema": { "$ref": "#/components/schemas/Error" } } } },
          "404": { "description": "Attachment, current channel, message state, or caller access is unavailable", "content": { "application/json": { "schema": { "$ref": "#/components/schemas/Error" } } } },
          "500": { "description": "Private attachment could not be read", "content": { "application/json": { "schema": { "$ref": "#/components/schemas/Error" } } } }
        }
      }
    },
    "/api/v1/channels/{channelID}/attachments/{attachmentID}/preview": {
      "get": {
        "operationId": "previewTextAttachment",
        "description": "Authenticated active account only. Before rendering, the server applies the same current TEXT-channel, attached-object, non-deleted-message and caller checks as download. Only a valid bounded PNG/JPEG/GIF source becomes a server-normalized PNG response; source bytes, source MIME, file name, storage key and local path are never exposed. Unsupported, corrupt, oversized, deleted or unauthorized sources are indistinguishable as 404.",
        "parameters": [
          { "name": "channelID", "in": "path", "required": true, "schema": { "type": "string", "format": "uuid" } },
          { "name": "attachmentID", "in": "path", "required": true, "schema": { "type": "string", "format": "uuid" } }
        ],
        "responses": {
          "200": {
            "description": "Private server-normalized PNG preview",
            "headers": {
              "Cache-Control": { "schema": { "type": "string", "enum": ["no-store"] } },
              "X-Content-Type-Options": { "schema": { "type": "string", "enum": ["nosniff"] } }
            },
            "content": { "image/png": { "schema": { "type": "string", "format": "binary" } } }
          },
          "400": { "description": "Malformed identifier", "content": { "application/json": { "schema": { "$ref": "#/components/schemas/Error" } } } },
          "401": { "description": "No active server-side session", "content": { "application/json": { "schema": { "$ref": "#/components/schemas/Error" } } } },
          "404": { "description": "Attachment, current channel, message state, caller access or safe preview is unavailable", "content": { "application/json": { "schema": { "$ref": "#/components/schemas/Error" } } } },
          "500": { "description": "Preview could not be rendered", "content": { "application/json": { "schema": { "$ref": "#/components/schemas/Error" } } } }
        }
      }
    },
    "/api/v1/channels/{channelID}/messages/{messageID}": {
      "patch": {
        "operationId": "editTextMessage",
        "description": "Authenticated author only. Updates a current non-deleted TEXT-channel message when expected_revision matches; unavailable, non-owned, deleted and stale messages all return the same conflict response.",
        "parameters": [
          { "name": "channelID", "in": "path", "required": true, "schema": { "type": "string", "format": "uuid" } },
          { "name": "messageID", "in": "path", "required": true, "schema": { "type": "string", "format": "uuid" } }
        ],
        "requestBody": {
          "required": true,
          "content": { "application/json": { "schema": { "$ref": "#/components/schemas/TextMessageEditRequest" } } }
        },
        "responses": {
          "200": { "description": "Updated message", "content": { "application/json": { "schema": { "$ref": "#/components/schemas/TextMessageEdited" } } } },
          "400": { "description": "Malformed or oversized message", "content": { "application/json": { "schema": { "$ref": "#/components/schemas/Error" } } } },
          "401": { "description": "No active server-side session", "content": { "application/json": { "schema": { "$ref": "#/components/schemas/Error" } } } },
          "409": { "description": "Message is stale or unavailable to this author", "content": { "application/json": { "schema": { "$ref": "#/components/schemas/Error" } } } },
          "500": { "description": "Internal error", "content": { "application/json": { "schema": { "$ref": "#/components/schemas/Error" } } } }
        }
      },
      "delete": {
        "operationId": "deleteTextMessage",
        "description": "Authenticated author or current ADMINISTRATOR only. Soft-deletes a current TEXT-channel message, clearing the stored body while retaining an audited deleted marker for history and replies.",
        "parameters": [
          { "name": "channelID", "in": "path", "required": true, "schema": { "type": "string", "format": "uuid" } },
          { "name": "messageID", "in": "path", "required": true, "schema": { "type": "string", "format": "uuid" } }
        ],
        "responses": {
          "204": { "description": "Message body replaced by a deleted marker" },
          "400": { "description": "Malformed identifier or role", "content": { "application/json": { "schema": { "$ref": "#/components/schemas/Error" } } } },
          "401": { "description": "No active server-side session", "content": { "application/json": { "schema": { "$ref": "#/components/schemas/Error" } } } },
          "404": { "description": "Message is unavailable to this principal", "content": { "application/json": { "schema": { "$ref": "#/components/schemas/Error" } } } },
          "500": { "description": "Internal error", "content": { "application/json": { "schema": { "$ref": "#/components/schemas/Error" } } } }
        }
      }
    },
    "/api/v1/voice/participants": {
      "get": {
        "operationId": "listConnectedVoiceParticipants",
        "description": "Authenticated non-blocked guild member; no voice lease required. Returns all current VOICE channels including empty rooms. Participants are LiveKit ICE-active voice-lease identities intersected with current unrevoked database leases, sessions and accounts. Names come from users, not LiveKit metadata. Screen sharing means a currently unmuted screen video publication in this snapshot; microphone_muted is true unless the participant has a currently unmuted microphone audio track. Speaking is not asserted. No result is cached.",
        "responses": {
          "200": { "description": "Current voice-room roster snapshot", "headers": { "Cache-Control": { "schema": { "type": "string", "enum": ["no-store"] } } }, "content": { "application/json": { "schema": { "$ref": "#/components/schemas/VoiceParticipants" } } } },
          "401": { "description": "No active server-side session", "content": { "application/json": { "schema": { "$ref": "#/components/schemas/Error" } } } },
          "503": { "description": "Private LiveKit RoomService snapshot unavailable; never interpreted as an empty roster", "content": { "application/json": { "schema": { "$ref": "#/components/schemas/Error" } } } },
          "500": { "description": "Internal error", "content": { "application/json": { "schema": { "$ref": "#/components/schemas/Error" } } } }
        }
      }
    },
    "/api/v1/voice/rosters/events": {
      "get": {
        "operationId": "watchConnectedVoiceParticipants",
        "description": "Authenticated non-blocked guild member; no voice lease required. Opens a short-lived Server-Sent Events stream of complete VoiceParticipants snapshots. Each snapshot is independently rebuilt from the caller's currently visible VOICE channels, active LiveKit participants and current unrevoked leases. LiveKit webhooks carry invalidation hints only; they never supply roster data. The stream closes after at most 10 seconds and clients reconnect to reauthenticate. Each event is one UTF-8 line `data: <JSON VoiceParticipants>` followed by a blank line. No event is cached.",
        "responses": {
          "200": {
            "description": "SSE stream of complete current voice-roster snapshots; one JSON snapshot per data event",
            "headers": {
              "Cache-Control": { "schema": { "type": "string", "enum": ["no-store"] } },
              "X-Accel-Buffering": { "schema": { "type": "string", "enum": ["no"] } }
            },
            "content": {
              "text/event-stream": {
                "schema": { "type": "string" },
                "examples": {
                  "snapshot": { "value": "data: {\"channels\":[{\"channel_id\":\"11111111-1111-4111-8111-111111111111\",\"participants\":[{\"account_id\":\"22222222-2222-4222-8222-222222222222\",\"display_name\":\"Мика\",\"screen_sharing\":false,\"microphone_muted\":true}]}]}\n\n" }
                }
              }
            }
          },
          "401": { "description": "No active server-side session", "content": { "application/json": { "schema": { "$ref": "#/components/schemas/Error" } } } },
          "503": { "description": "Private LiveKit RoomService snapshot unavailable; stream is not opened with a fabricated empty roster", "content": { "text/plain": { "schema": { "type": "string" } } } },
          "500": { "description": "Response writer does not support streaming", "content": { "text/plain": { "schema": { "type": "string" } } } }
        }
      }
    },
    "/api/v1/voice/screen-metrics": {
      "post": {
        "operationId": "reportClientScreenMetrics",
        "description": "Authenticated client report. Strict 2 KiB body with fixed platform/direction/state enums and bounded numeric measurements only; no user, room, track, address, SDP or content fields. Client-reported values are diagnostic and not capability evidence. Mutation requires the deployment Origin.",
        "requestBody": { "required": true, "content": { "application/json": { "schema": { "$ref": "#/components/schemas/ClientScreenReport" } } } },
        "responses": {
          "204": { "description": "Anonymous report accepted" },
          "400": { "description": "Malformed or out-of-range report" },
          "401": { "description": "No active server-side session", "content": { "application/json": { "schema": { "$ref": "#/components/schemas/Error" } } } },
          "403": { "description": "Origin rejected", "content": { "application/json": { "schema": { "$ref": "#/components/schemas/Error" } } } }
        }
      }
    },
    "/api/v1/voice/channels/{channelID}/leases": {
      "post": {
        "operationId": "acquireVoiceLease",
        "description": "Authenticated user only. Creates one logical lease for an active VOICE channel. A second tab or device receives 409 until the user explicitly submits transfer:true; this command does not itself claim that LiveKit is connected.",
        "parameters": [
          { "name": "channelID", "in": "path", "required": true, "schema": { "type": "string", "format": "uuid" } }
        ],
        "requestBody": {
          "required": true,
          "content": { "application/json": { "schema": { "$ref": "#/components/schemas/VoiceLeaseRequest" } } }
        },
        "responses": {
          "201": { "description": "Logical lease created; media credential and LiveKit confirmation are separate steps", "content": { "application/json": { "schema": { "$ref": "#/components/schemas/VoiceLease" } } } },
          "400": { "description": "Malformed request", "content": { "application/json": { "schema": { "$ref": "#/components/schemas/Error" } } } },
          "401": { "description": "No active server-side session", "content": { "application/json": { "schema": { "$ref": "#/components/schemas/Error" } } } },
          "409": { "description": "Existing lease, closed admission, archived/non-voice channel or stale state", "content": { "application/json": { "schema": { "$ref": "#/components/schemas/VoiceLeaseConflict" } } } },
          "500": { "description": "Internal error", "content": { "application/json": { "schema": { "$ref": "#/components/schemas/Error" } } } }
        }
      }
    },
    "/api/v1/voice/leases/{leaseID}": {
      "delete": {
        "operationId": "releaseVoiceLease",
        "description": "Authenticated user only. Idempotently releases an active logical lease only when it belongs to the current server-side session; no media-disconnect claim is made.",
        "parameters": [
          { "name": "leaseID", "in": "path", "required": true, "schema": { "type": "string", "format": "uuid" } }
        ],
        "responses": {
          "204": { "description": "Matching logical lease released, or no matching active lease exists" },
          "400": { "description": "Malformed lease identifier", "content": { "application/json": { "schema": { "$ref": "#/components/schemas/Error" } } } },
          "401": { "description": "No valid active session", "content": { "application/json": { "schema": { "$ref": "#/components/schemas/Error" } } } },
          "500": { "description": "Internal error", "content": { "application/json": { "schema": { "$ref": "#/components/schemas/Error" } } } }
        }
      }
    },
    "/api/v1/voice/leases/{leaseID}/credential": {
      "post": {
        "operationId": "issueLiveKitCredential",
        "description": "Authenticated user only. Rechecks the active session-bound lease, VOICE channel and account state, then returns a 60-second room-scoped non-admin LiveKit JWT. Issuance is not evidence that a LiveKit join completed or that a later revocation is enforced.",
        "parameters": [
          { "name": "leaseID", "in": "path", "required": true, "schema": { "type": "string", "format": "uuid" } }
        ],
        "responses": {
          "200": { "description": "Short-lived credential for the lease room", "content": { "application/json": { "schema": { "$ref": "#/components/schemas/LiveKitCredential" } } } },
          "400": { "description": "Malformed lease ID", "content": { "application/json": { "schema": { "$ref": "#/components/schemas/Error" } } } },
          "401": { "description": "No valid active session", "content": { "application/json": { "schema": { "$ref": "#/components/schemas/Error" } } } },
          "409": { "description": "Lease, channel or account is no longer active", "content": { "application/json": { "schema": { "$ref": "#/components/schemas/Error" } } } },
          "500": { "description": "Signer or storage failure", "content": { "application/json": { "schema": { "$ref": "#/components/schemas/Error" } } } }
        }
      }
    },
    "/api/v1/admin/accounts/{accountID}/voice-kick": {
      "post": {
        "operationId": "kickVoiceParticipant",
        "description": "Administrator-only. Revokes the target account's current logical voice lease, records audit metadata and creates a durable SFU revocation. The response counts logical leases only; completion and token replay remain POC-03 gates.",
        "parameters": [
          { "name": "accountID", "in": "path", "required": true, "schema": { "type": "string", "format": "uuid" } }
        ],
        "responses": {
          "200": { "description": "Logical leases revoked", "content": { "application/json": { "schema": { "$ref": "#/components/schemas/VoiceKick" } } } },
          "400": { "description": "Malformed account ID", "content": { "application/json": { "schema": { "$ref": "#/components/schemas/Error" } } } },
          "401": { "description": "No valid active session", "content": { "application/json": { "schema": { "$ref": "#/components/schemas/Error" } } } },
          "403": { "description": "Administrator role required", "content": { "application/json": { "schema": { "$ref": "#/components/schemas/Error" } } } },
          "500": { "description": "Internal error", "content": { "application/json": { "schema": { "$ref": "#/components/schemas/Error" } } } }
        }
      }
    },
    "/api/v1/auth/register": {
      "post": {
        "operationId": "register",
        "requestBody": {
          "required": true,
          "content": {
            "application/json": {
              "schema": { "$ref": "#/components/schemas/RegistrationRequest" }
            }
          }
        },
        "responses": {
          "201": {
            "description": "Member account created; login is a separate action",
            "content": {
              "application/json": {
                "schema": { "$ref": "#/components/schemas/Account" }
              }
            }
          },
          "400": { "description": "Validation error", "content": { "application/json": { "schema": { "$ref": "#/components/schemas/Error" } } } },
          "409": { "description": "Normalized login already exists", "content": { "application/json": { "schema": { "$ref": "#/components/schemas/Error" } } } },
          "500": { "description": "Internal error", "content": { "application/json": { "schema": { "$ref": "#/components/schemas/Error" } } } }
        }
      }
    },
    "/api/v1/auth/login": {
      "post": {
        "operationId": "login",
        "requestBody": {
          "required": true,
          "content": {
            "application/json": {
              "schema": { "$ref": "#/components/schemas/LoginRequest" }
            }
          }
        },
        "responses": {
          "204": {
