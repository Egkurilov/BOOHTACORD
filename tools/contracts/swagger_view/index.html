<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>BOOHTACORD public API</title>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/swagger-ui-dist@5.31.0/swagger-ui.css">
</head>
<body>
  <p>Public API reference. Request execution is disabled in this local viewer.
    Secure browser sessions and mutation Origin checks require the deployment origin.</p>
  <div id="swagger-ui"></div>
  <script src="https://cdn.jsdelivr.net/npm/swagger-ui-dist@5.31.0/swagger-ui-bundle.js"></script>
  <script>
    window.onload = () => SwaggerUIBundle({
      url: '/openapi.json',
      dom_id: '#swagger-ui',
      deepLinking: true,
      validatorUrl: null,
      supportedSubmitMethods: [],
      persistAuthorization: false,
      presets: [SwaggerUIBundle.presets.apis]
    });
  </script>
</body>
</html>
