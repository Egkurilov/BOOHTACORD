name: voice-platform

x-json-log-rotation: &json-log-rotation
  driver: json-file
  options:
    max-size: "10m"
    max-file: "3"

services:
  postgres:
    image: postgres:17.6-alpine
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-voice_platform}
      POSTGRES_USER: ${POSTGRES_USER:-voice_platform}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 5s
      timeout: 3s
      retries: 12
    volumes:
      - postgres-data:/var/lib/postgresql/data
    networks: [private]
    logging: *json-log-rotation

  livekit:
    image: livekit/livekit-server:v1.13.7
    entrypoint: ["/bin/sh", "-ec"]
    command:
      - |
        awk '
          BEGIN {
            key = ENVIRON["LIVEKIT_API_KEY"]
            secret = ENVIRON["LIVEKIT_API_SECRET"]
            if (key == "" || secret == "") exit 1
          }
          $0 == "  __LIVEKIT_API_KEY__: __LIVEKIT_API_SECRET__" {
            print "  " key ": " secret
            replaced = 1
            next
          }
          $0 == "  api_key: __LIVEKIT_API_KEY__" {
            print "  api_key: " key
            next
          }
          { print }
          END { if (!replaced) exit 1 }
        ' /etc/livekit-template.yaml > /tmp/livekit.yaml
        exec /livekit-server --config /tmp/livekit.yaml --node-ip "$${LIVEKIT_NODE_IP}"
    environment:
      LIVEKIT_API_KEY: ${LIVEKIT_API_KEY:?set LIVEKIT_API_KEY in .env}
      LIVEKIT_API_SECRET: ${LIVEKIT_API_SECRET:?set LIVEKIT_API_SECRET in .env}
      LIVEKIT_NODE_IP: ${LIVEKIT_NODE_IP:?set LIVEKIT_NODE_IP in .env}
    ports:
      - "7882:7882/tcp"
      - "50000-50100:50000-50100/udp"
    volumes:
      - ./docker/livekit.yaml:/etc/livekit-template.yaml:ro
    networks: [edge, private]
    logging: *json-log-rotation

  api:
    image: ${API_IMAGE:?set API_IMAGE to a pinned image reference in .env}
    build:
      context: ./backend
    environment:
      API_ADDR: :8080
      PUBLIC_ORIGIN: ${PUBLIC_ORIGIN:-http://localhost:8088}
      DATABASE_URL: postgres://${POSTGRES_USER:-voice_platform}:${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}@postgres:5432/${POSTGRES_DB:-voice_platform}?sslmode=disable
      LIVEKIT_API_KEY: ${LIVEKIT_API_KEY:?set LIVEKIT_API_KEY in .env}
      LIVEKIT_API_SECRET: ${LIVEKIT_API_SECRET:?set LIVEKIT_API_SECRET in .env}
      LIVEKIT_PUBLIC_WS_URL: ${LIVEKIT_PUBLIC_WS_URL:?set LIVEKIT_PUBLIC_WS_URL in .env}
      LIVEKIT_PRIVATE_HTTP_URL: ${LIVEKIT_PRIVATE_HTTP_URL:-http://livekit:7880}
      ATTACHMENTS_DIRECTORY: /var/lib/voice-platform/attachments
    depends_on:
      migrate:
        condition: service_completed_successfully
    volumes:
      - attachments-data:/var/lib/voice-platform/attachments
    networks: [private]
    logging: *json-log-rotation

  migrate:
    image: ${API_IMAGE:?set API_IMAGE to a pinned image reference in .env}
    build:
      context: ./backend
    entrypoint: ["/migrate"]
    environment:
      DATABASE_URL: postgres://${POSTGRES_USER:-voice_platform}:${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}@postgres:5432/${POSTGRES_DB:-voice_platform}?sslmode=disable
    depends_on:
      postgres:
        condition: service_healthy
    networks: [private]

  bootstrap-admin:
    profiles: [operator]
    image: ${API_IMAGE:?set API_IMAGE to a pinned image reference in .env}
    build:
      context: ./backend
    entrypoint: ["/bootstrap-admin"]
    environment:
      DATABASE_URL: postgres://${POSTGRES_USER:-voice_platform}:${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}@postgres:5432/${POSTGRES_DB:-voice_platform}?sslmode=disable
    depends_on:
      postgres:
        condition: service_healthy
    networks: [private]

  recover-admin:
    profiles: [operator]
    image: ${API_IMAGE:?set API_IMAGE to a pinned image reference in .env}
    build:
      context: ./backend
    entrypoint: ["/recover-admin"]
    environment:
      DATABASE_URL: postgres://${POSTGRES_USER:-voice_platform}:${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}@postgres:5432/${POSTGRES_DB:-voice_platform}?sslmode=disable
    depends_on:
      postgres:
        condition: service_healthy
    networks: [private]

  recover-last-admin-access:
    profiles: [operator]
    image: ${API_IMAGE:?set API_IMAGE to a pinned image reference in .env}
    build:
      context: ./backend
    entrypoint: ["/recover-last-admin-access"]
    environment:
      DATABASE_URL: postgres://${POSTGRES_USER:-voice_platform}:${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}@postgres:5432/${POSTGRES_DB:-voice_platform}?sslmode=disable
    depends_on:
      postgres:
        condition: service_healthy
    networks: [private]

  maintenance-admission:
    profiles: [operator]
    image: ${API_IMAGE:?set API_IMAGE to a pinned image reference in .env}
    build:
      context: ./backend
    entrypoint: ["/maintenance-admission"]
    environment:
      DATABASE_URL: postgres://${POSTGRES_USER:-voice_platform}:${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}@postgres:5432/${POSTGRES_DB:-voice_platform}?sslmode=disable
    depends_on:
      postgres:
        condition: service_healthy
    networks: [private]

  cleanup-stale-staging:
    profiles: [operator]
    image: ${API_IMAGE:?set API_IMAGE to a pinned image reference in .env}
    build:
      context: ./backend
    entrypoint: ["/cleanup-stale-staging"]
    environment:
      ATTACHMENTS_DIRECTORY: /var/lib/voice-platform/attachments
    volumes:
      - attachments-data:/var/lib/voice-platform/attachments
    networks: [private]

  cleanup-unattached-attachments:
    profiles: [operator]
    image: ${API_IMAGE:?set API_IMAGE to a pinned image reference in .env}
    build:
      context: ./backend
    entrypoint: ["/cleanup-unattached-attachments"]
    environment:
      DATABASE_URL: postgres://${POSTGRES_USER:-voice_platform}:${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}@postgres:5432/${POSTGRES_DB:-voice_platform}?sslmode=disable
      ATTACHMENTS_DIRECTORY: /var/lib/voice-platform/attachments
    depends_on:
      postgres:
        condition: service_healthy
    volumes:
      - attachments-data:/var/lib/voice-platform/attachments
    networks: [private]

  cleanup-hidden-attachments:
    profiles: [operator]
    image: ${API_IMAGE:?set API_IMAGE to a pinned image reference in .env}
    build:
      context: ./backend
    entrypoint: ["/cleanup-hidden-attachments"]
    environment:
      DATABASE_URL: postgres://${POSTGRES_USER:-voice_platform}:${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}@postgres:5432/${POSTGRES_DB:-voice_platform}?sslmode=disable
      ATTACHMENTS_DIRECTORY: /var/lib/voice-platform/attachments
    depends_on:
      postgres:
        condition: service_healthy
    volumes:
      - attachments-data:/var/lib/voice-platform/attachments
    networks: [private]

  web:
    image: ${WEB_IMAGE:?set WEB_IMAGE to a pinned image reference in .env}
    build:
      context: ./frontend
    networks: [private]
    logging: *json-log-rotation

  proxy:
    image: caddy:2.10.0-alpine
    environment:
      PUBLIC_HOST: ${PUBLIC_HOST:?set PUBLIC_HOST in .env}
    ports:
      - "80:80"
      - "443:443"
    depends_on: [api, web]
    volumes:
      - ./docker/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy-data:/data
      - caddy-config:/config
    networks: [edge, private]
    logging: *json-log-rotation

networks:
  edge:
  private:
    internal: true

volumes:
  postgres-data:
  attachments-data:
  caddy-data:
  caddy-config:
