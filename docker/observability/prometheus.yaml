global:
  scrape_interval: 15s

scrape_configs:
  - job_name: boohtacord-otel-metrics
    static_configs:
      - targets: ["collector:8889"]
  - job_name: boohtacord-tempo
    static_configs:
      - targets: ["tempo:3200"]
  - job_name: boohtacord-prometheus
    static_configs:
      - targets: ["localhost:9090"]
