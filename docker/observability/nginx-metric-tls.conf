limit_req_zone $binary_remote_addr zone=boohtacord_otel:10m rate=30r/s;

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    server_name metric.bootybay.ru;
    ssl_certificate /etc/letsencrypt/live/metric.bootybay.ru/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/metric.bootybay.ru/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;
    client_max_body_size 2m;
    access_log off;

    location ~ ^/v1/(traces|metrics)$ {
        limit_except POST { deny all; }
        limit_req zone=boohtacord_otel burst=60 nodelay;
        auth_basic "BOOHTACORD telemetry";
        auth_basic_user_file /etc/nginx/boohtacord-otel.htpasswd;
        proxy_set_header Authorization "";
        proxy_set_header Host 127.0.0.1;
        proxy_pass http://127.0.0.1:4318;
        proxy_connect_timeout 3s;
        proxy_read_timeout 10s;
        proxy_send_timeout 10s;
    }

    location / { return 404; }
}
