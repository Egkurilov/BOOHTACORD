name: Deploy production

on:
  push:
    branches: [master, 'codex/**']
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: v-bootybay-production
  cancel-in-progress: false

jobs:
  backend:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      VOICE_PLATFORM_TEST_DATABASE_URL: postgres://voice_platform_test:test-only-password@127.0.0.1:5432/voice_platform_test?sslmode=disable
      TEST_DATABASE_URL: postgres://voice_platform_test:test-only-password@127.0.0.1:5432/voice_platform_test?sslmode=disable
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: backend/go.mod
          cache: false
      - name: Start mandatory PostgreSQL test database
        shell: bash
        run: bash scripts/start-ci-postgres.sh
      - name: Test and vet Go API
        working-directory: backend
        shell: bash
        run: |
          set -euo pipefail
          test -n "$VOICE_PLATFORM_TEST_DATABASE_URL"
          test -n "$TEST_DATABASE_URL"
          test_events="$(mktemp "${RUNNER_TEMP:-/tmp}/backend-test-events.XXXXXX")"
          test_status=0
          go test -json -count=1 ./... > "$test_events" || test_status=$?
          python3 ../scripts/verify-go-test-events.py "$test_events"
          test "$test_status" -eq 0
          go vet ./...

  frontend:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Test and build Vue client
        working-directory: frontend
        run: |
          npm ci
          npm test
          npm run build

  release_guard:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - name: Verify contracts, traceability, images and release guards
        shell: bash
        run: bash scripts/verify-release-guards.sh

  deploy:
    if: ${{ gitverse.ref_name == 'master' }}
    needs: [backend, frontend, release_guard]
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      DEPLOY_SERVER_IP: 176.108.242.211
      DEPLOY_SSH_PRIVATE_KEY: ${{ secrets.DEPLOY_SSH_PRIVATE_KEY }}
      SSH_USER: shaneque
    steps:
      - uses: actions/checkout@v4
      - name: Inspect storage and reclaim allowlisted unused release images
        shell: bash
        run: bash scripts/qa08_capacity/prepare_host_storage.sh

      - name: Package the checked-out source
        id: source
        shell: bash
        run: |
          set -euo pipefail
          git_sha="$(git rev-parse HEAD)"
          [[ "$git_sha" =~ ^[0-9a-f]{40}$ ]]
          archive="${RUNNER_TEMP:?}/voice-platform-${git_sha}.tar.gz"
          tar --exclude-vcs --exclude=.env --exclude=frontend/node_modules -czf "$archive" .
          printf 'git_sha=%s\n' "$git_sha" >> "$GITVERSE_OUTPUT"
          printf 'archive=%s\n' "$archive" >> "$GITVERSE_OUTPUT"
          printf 'archive_sha256=%s\n' "$(sha256sum "$archive" | awk '{print $1}')" >> "$GITVERSE_OUTPUT"

      - name: Transfer, build and perform guarded release
        shell: bash
        env:
          ARCHIVE: ${{ steps.source.outputs.archive }}
          ARCHIVE_SHA256: ${{ steps.source.outputs.archive_sha256 }}
          GIT_SHA: ${{ steps.source.outputs.git_sha }}
        run: |
          set -euo pipefail
          remote="${SSH_USER}@${DEPLOY_SERVER_IP}"
          remote_archive="/tmp/voice-platform-${GIT_SHA}.tar.gz"
          ssh_options=(-i ~/.ssh/id_deploy -o BatchMode=yes -o StrictHostKeyChecking=yes -o UserKnownHostsFile="$HOME/.ssh/known_hosts")
          scp "${ssh_options[@]}" "$ARCHIVE" "$remote:$remote_archive"
          ssh "${ssh_options[@]}" "$remote" bash -s -- "$GIT_SHA" "$ARCHIVE_SHA256" < scripts/install-received-release.sh
      - name: Audit live attachment headroom after rollout
        shell: bash
        run: |
          set -euo pipefail
          git_sha="$(git rev-parse HEAD)"
          remote="${SSH_USER}@${DEPLOY_SERVER_IP}"
          ssh_options=(-i ~/.ssh/id_deploy -o BatchMode=yes -o StrictHostKeyChecking=yes -o UserKnownHostsFile="$HOME/.ssh/known_hosts")
          ssh "${ssh_options[@]}" "$remote" bash -s -- "$git_sha" < scripts/audit-attachment-volume.sh
