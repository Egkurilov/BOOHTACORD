name: Flutter macOS CI

# Temporary: automatic runs stay off until a macOS runner is provisioned.
# Keep manual dispatch available for an intentional run after the runner returns.
on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  macos:
    runs-on: [self-hosted, macos]
    steps:
      - uses: actions/checkout@v4
      - name: Set up Flutter 3.47.5
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: 3.47.5
          cache: true
      - name: Verify Flutter toolchain
        run: flutter --version
      - name: Resolve locked Flutter dependencies
        working-directory: desktop
        run: flutter pub get --enforce-lockfile
      - name: Test macOS release packaging
        run: bash scripts/macos_release/package.test.sh
      - name: Run Flutter tests
        working-directory: desktop
        run: flutter test
      - name: Analyze Flutter client
        working-directory: desktop
        run: flutter analyze --no-fatal-infos
      - name: Build universal macOS release client
        working-directory: desktop
        run: flutter build macos --release --no-pub
