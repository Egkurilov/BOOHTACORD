name: Flutter Windows CI

on:
  push:
    branches: [master]
    paths:
      - 'desktop/**'
      - '.gitverse/workflows/flutter-windows.yaml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  windows:
    if: ${{ vars.WINDOWS_RUNNER_ENABLED == 'true' }}
    runs-on: boohtacord-windows
    steps:
      - uses: actions/checkout@v4
      - name: Set up Flutter 3.47.5
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: 3.47.5
          cache: true
      - name: Verify Flutter toolchain
        run: flutter --version
      - name: Resolve locked Flutter dependencies
        working-directory: desktop
        run: flutter pub get
      - name: Run Flutter tests
        working-directory: desktop
        run: flutter test
      - name: Analyze Flutter client
        working-directory: desktop
        run: flutter analyze
      - name: Build Windows release client
        working-directory: desktop
        run: flutter build windows --release
