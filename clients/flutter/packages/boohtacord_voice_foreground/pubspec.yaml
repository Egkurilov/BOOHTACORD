name: boohtacord_voice_foreground
description: Private foreground lifetime for an explicitly enabled Android voice microphone.
version: 1.0.0
publish_to: none
environment:
  sdk: ^3.13.4
  flutter: '>=3.44.0'
dependencies:
  flutter:
    sdk: flutter
flutter:
  plugin:
    platforms:
      android:
        package: ru.boohtacord.voice.start
        pluginClass: VoiceMicrophonePlugin
