buildscript {
    ext.kotlin_version = '2.1.0'
    repositories {
        google()
        mavenCentral()
    }

    dependencies {
        classpath 'com.android.tools.build:gradle:8.1.0'
        classpath "org.jetbrains.kotlin:kotlin-gradle-plugin:$kotlin_version"
    }
}

group 'de.julianassmann.flutter_background'
version '1.0-SNAPSHOT'

apply plugin: 'com.android.library'

def agpMajor = com.android.Version.ANDROID_GRADLE_PLUGIN_VERSION.tokenize('.')[0] as int
def builtInKotlinActive = agpMajor >= 9 &&
    (!project.hasProperty('android.builtInKotlin') ||
        Boolean.parseBoolean(project.property('android.builtInKotlin').toString()))
if (!builtInKotlinActive) {
    // KGP is needed only on legacy builds. Apply it imperatively so Flutter's
    // static migration detector does not treat this conditional as unconditional.
    pluginManager.apply('kotlin-android')
}

android {
    compileSdkVersion 34

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_1_8
        targetCompatibility JavaVersion.VERSION_1_8
    }

    sourceSets {
        main.java.srcDirs += 'src/main/kotlin'
    }

    defaultConfig {
        minSdkVersion 16
    }

    namespace 'de.julianassmann.flutter_background'
}

def kotlinExt = project.extensions.findByName('kotlin')
if (kotlinExt?.hasProperty('compilerOptions')) {
    kotlin {
        compilerOptions {
            jvmTarget = org.jetbrains.kotlin.gradle.dsl.JvmTarget.JVM_1_8
        }
    }
} else {
    android.kotlinOptions {
        jvmTarget = JavaVersion.VERSION_1_8.toString()
    }
}

rootProject.allprojects {
    repositories {
        google()
        mavenCentral()
    }
}
