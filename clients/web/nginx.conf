server {
  listen 80;
  server_name _;
  root /usr/share/nginx/html;

  # Versioned DSP assets must fail explicitly; HTML is never a WASM fallback.
  location ^~ /audio/rnnoise/ {
    types { application/wasm wasm; application/json json; text/plain txt; }
    default_type application/octet-stream;
    add_header Cache-Control "public, max-age=31536000, immutable" always;
    add_header X-Content-Type-Options "nosniff" always;
    try_files $uri =404;
  }

  location / {
    try_files $uri $uri/ /index.html;
  }
}
