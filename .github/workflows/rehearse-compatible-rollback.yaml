name: Rehearse compatible image rollback

# GitHub manual rehearsal only after observer confirmation.

on:
  workflow_dispatch:
    inputs:
      current_sha:
        description: 'Exact currently deployed 40-character master revision'
        required: true
        type: string
      previous_sha:
        description: 'Exact prevalidated previous local image revision'
        required: true
        type: string
      observers_confirmed:
        description: 'Two authenticated browser observers and maintenance window are ready'
        required: true
        type: choice
        options: [not-ready, two-browsers-ready]
        default: not-ready

permissions:
  contents: read

concurrency:
  group: v-bootybay-production
  cancel-in-progress: false

jobs:
  rehearse:
    if: ${{ github.ref_name == 'master' }}
    environment: production
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      DEPLOY_SERVER_IP: 176.108.242.211
      DEPLOY_SSH_PRIVATE_KEY: ${{ secrets.DEPLOY_SSH_PRIVATE_KEY }}
      SSH_USER: shaneque
      CURRENT_SHA: ${{ inputs.current_sha }}
      PREVIOUS_SHA: ${{ inputs.previous_sha }}
      OBSERVERS_CONFIRMED: ${{ inputs.observers_confirmed }}
    steps:
      - uses: actions/checkout@v4
      - name: Reject drift or unobserved rehearsal before SSH
        shell: bash
        run: |
          set -euo pipefail
          [[ "$CURRENT_SHA" =~ ^[0-9a-f]{40}$ ]]
          [[ "$PREVIOUS_SHA" =~ ^[0-9a-f]{40}$ ]]
          [[ "$CURRENT_SHA" != "$PREVIOUS_SHA" ]]
          [[ "$OBSERVERS_CONFIRMED" == two-browsers-ready ]]
      - name: Configure pinned SSH transport
        shell: bash
        run: bash tools/release/ssh/configure-deploy-ssh.sh
      - name: Rehearse signed previous bundle and restore current
        run: bash tools/release/delivery/rollback.sh
