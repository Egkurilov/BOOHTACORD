name: Android Release

# A matching android-v* tag publishes signed APKs using repository signing secrets.
on:
  push:
    tags:
      - 'android-v*'

permissions:
  contents: write

jobs:
  quality:
    uses: ./.github/workflows/ci-flutter.yaml

  android-release:
    needs: quality
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout release source
        uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: actions/setup-node@v4
        with:
          node-version-file: .node-version

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: 3.47.5
          cache: true

      - name: Test idempotent GitHub release publisher
        run: node --test tools/release/android/publish.test.mjs tools/release/android/publish_retries.test.mjs tools/release/android/publish_conflicts.test.mjs

      - name: Build signed ABI-specific APKs
        working-directory: clients/flutter
        shell: bash
        env:
          BOOHTACORD_ANDROID_KEYSTORE_BASE64: ${{ secrets.BOOHTACORD_ANDROID_KEYSTORE_BASE64 }}
          BOOHTACORD_ANDROID_KEYSTORE_PASSWORD: ${{ secrets.BOOHTACORD_ANDROID_KEYSTORE_PASSWORD }}
          BOOHTACORD_ANDROID_KEY_ALIAS: ${{ secrets.BOOHTACORD_ANDROID_KEY_ALIAS }}
          BOOHTACORD_ANDROID_KEY_PASSWORD: ${{ secrets.BOOHTACORD_ANDROID_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          for name in BOOHTACORD_ANDROID_KEYSTORE_BASE64 BOOHTACORD_ANDROID_KEYSTORE_PASSWORD BOOHTACORD_ANDROID_KEY_ALIAS BOOHTACORD_ANDROID_KEY_PASSWORD; do
            if [[ -z "${!name:-}" ]]; then
              echo "Required repository secret is missing: $name" >&2
              exit 1
            fi
          done

          [[ "${GITHUB_REF_NAME}" =~ ^android-v[0-9]+\.[0-9]+\.[0-9]+$ ]] || { echo 'Invalid Android release tag' >&2; exit 1; }
          pubspec_version="$(sed -nE 's/^version:[[:space:]]*([^+[:space:]]+).*/\1/p' pubspec.yaml | head -n 1)"
          if [[ "${GITHUB_REF_NAME#android-v}" != "$pubspec_version" ]]; then
            echo "Release tag does not match pubspec version $pubspec_version" >&2
            exit 1
          fi
          flutter --version | grep -q 'Flutter 3.47.5'
          : "${RUNNER_TEMP:?RUNNER_TEMP must be configured}"
          keystore="$RUNNER_TEMP/boohtacord-android-upload.jks"
          trap 'rm -f "$keystore"' EXIT
          printf '%s' "$BOOHTACORD_ANDROID_KEYSTORE_BASE64" | base64 --decode > "$keystore"
          chmod 600 "$keystore"
          export BOOHTACORD_ANDROID_KEYSTORE_FILE="$keystore"

          flutter pub get --enforce-lockfile
          flutter build apk --release --split-per-abi --no-pub

          mkdir -p build/release-assets
          for abi in arm64-v8a armeabi-v7a x86_64; do
            source="build/app/outputs/flutter-apk/app-${abi}-release.apk"
            test -s "$source" || { echo "Missing split APK: $source" >&2; exit 1; }
            bytes="$(stat -c '%s' "$source")"
            if (( bytes > 95000000 )); then
              echo "APK exceeds the 95 MB release safety ceiling: $source ($bytes bytes)" >&2
              exit 1
            fi
            cp "$source" "build/release-assets/BOOHTACORD-${GITHUB_REF_NAME}-${abi}.apk"
            echo "Prepared $abi APK ($bytes bytes)"
          done

      - name: Upload signed APKs as workflow artifacts
        uses: actions/upload-artifact@v4
        with:
          name: BOOHTACORD-${{ github.ref_name }}-signed-apks
          path: clients/flutter/build/release-assets/*.apk
          if-no-files-found: error
          retention-days: 30

      - name: Publish GitHub release and APK assets
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          tag="$GITHUB_REF_NAME"
          asset_root=clients/flutter/build/release-assets
          node tools/release/android/publish.mjs \
            --tag "$tag" \
            --asset "$asset_root/BOOHTACORD-$tag-arm64-v8a.apk" \
            --asset "$asset_root/BOOHTACORD-$tag-armeabi-v7a.apk" \
            --asset "$asset_root/BOOHTACORD-$tag-x86_64.apk"
