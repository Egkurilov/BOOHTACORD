name: Flutter macOS CI

# GitHub manual build while the macOS self-hosted runner is being migrated.

# Keep manual dispatch until a GitHub macOS runner is provisioned.
on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  macos:
    runs-on: [self-hosted, macos]
    steps:
      - uses: actions/checkout@v4
      - name: Set up Flutter 3.47.5
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: 3.47.5
          cache: true
      - name: Verify Flutter toolchain
        run: flutter --version
      - name: Resolve locked Flutter dependencies
        working-directory: desktop
        run: flutter pub get --enforce-lockfile
      - name: Test macOS release packaging
        run: bash scripts/macos_release/package.test.sh
      - name: Run Flutter tests
        working-directory: desktop
        run: flutter test
      - name: Analyze Flutter client
        working-directory: desktop
        run: flutter analyze --no-fatal-infos
      - name: Build universal macOS release client
        working-directory: desktop
        run: flutter build macos --release --no-pub
      - name: Package macOS CI build and checksum
        shell: bash
        run: |
          set -euo pipefail
          version="$(sed -E -n 's/^version: *([0-9][0-9.]*)\+[0-9][0-9]*$/\1/p' desktop/pubspec.yaml)"
          test -n "$version"
          bash scripts/macos_release/package.sh \
            desktop/build/macos/Build/Products/Release/BOOHTACORD.app \
            "macos-v$version" \
            "$RUNNER_TEMP/boohtacord-macos-artifacts"
      - name: Retain macOS build and checksum as workflow artifact
        uses: actions/upload-artifact@v4
        with:
          name: BOOHTACORD-macos-universal-${{ github.sha }}
          path: ${{ runner.temp }}/boohtacord-macos-artifacts/
          if-no-files-found: error
          retention-days: 30
          compression-level: 0
