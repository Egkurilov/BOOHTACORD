name: CI Flutter

on:
  workflow_call:

permissions:
  contents: read

jobs:
  flutter:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: 3.47.5
          cache: true
      - name: Test and analyze app and vendor packages
        run: python3 -m tools.ci.native.flutter
      - name: Verify Android Kotlin build modes
        run: bash tools/verify/android_kotlin/verify_android_kotlin_modes.sh
      - name: Build Android debug APK
        working-directory: clients/flutter
        run: flutter build apk --debug --no-pub
      - name: Upload Android debug APK
        uses: actions/upload-artifact@v4
        with:
          name: boohtacord-android-debug-apk
          path: clients/flutter/build/app/outputs/flutter-apk/app-debug.apk
          if-no-files-found: error
          retention-days: 30
