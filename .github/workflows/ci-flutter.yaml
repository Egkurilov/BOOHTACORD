name: CI Flutter

on:
  workflow_call:

permissions:
  contents: read

jobs:
  flutter:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: 3.47.5
          cache: true
      - name: Resolve locked app dependencies
        working-directory: desktop
        run: flutter pub get --enforce-lockfile
      - name: Test Flutter app
        working-directory: desktop
        run: flutter test --no-pub
      - name: Test forked LiveKit package
        working-directory: desktop/packages/livekit_client
        run: |
          flutter pub get
          flutter test --no-pub
      - name: Test forked WebRTC package
        working-directory: desktop/packages/flutter_webrtc
        run: |
          flutter pub get
          flutter test --no-pub
      - name: Analyze Flutter app
        working-directory: desktop
        run: flutter analyze --no-pub --no-fatal-infos
      - name: Compile Android debug APK
        working-directory: desktop
        run: flutter build apk --debug --no-pub
