name: Flutter Windows CI

on:
  workflow_call:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  windows:
    runs-on: windows-2025
    steps:
      - name: Enable long paths for Windows checkout
        shell: powershell
        run: git config --global core.longpaths true
      - uses: actions/checkout@v4
        with:
          # Keep the release publisher in the CI checkout for its HTTP contract tests.
          sparse-checkout: |
            desktop
            scripts/android_release
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: 3.47.5
          channel: stable
          cache: true
      - name: Verify installed Flutter 3.47.5
        shell: powershell
        run: |
          $version = (flutter --version --machine | ConvertFrom-Json).frameworkVersion
          if ($LASTEXITCODE -ne 0 -or $version -ne '3.47.5') { throw "Expected Flutter 3.47.5, got $version" }
      - name: Resolve locked Flutter dependencies
        working-directory: desktop
        shell: powershell
        run: |
          flutter pub get --enforce-lockfile
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Point CMake at Windows plugin sources
        working-directory: desktop
        shell: powershell
        run: |
          # Flutter creates plugin links; this host's CMake cannot read through them.
          $metadata = Get-Content -Raw .flutter-plugins-dependencies | ConvertFrom-Json
          $cmakeFile = Join-Path (Get-Location) 'windows\flutter\generated_plugins.cmake'
          $content = [System.IO.File]::ReadAllText($cmakeFile)
          $sourceLines = @()
          foreach ($plugin in $metadata.plugins.windows) {
            $pluginRoot = [System.IO.Path]::GetFullPath($plugin.path)
            $pluginCMake = Join-Path $pluginRoot 'windows\CMakeLists.txt'
            if (-not (Test-Path -LiteralPath $pluginCMake)) { continue }
            if ($plugin.name -notmatch '^[a-z0-9_]+$' -or $pluginRoot -match '[";]') { throw 'Unsupported plugin name or path' }
            $sourceLines += "set(BOOHTACORD_PLUGIN_SOURCE_$($plugin.name) `"$($pluginRoot.Replace('\','/'))`")"
          }
          $pluginPath = 'flutter/ephemeral/.plugin_symlinks/${plugin}/windows'
          $ffiPath = 'flutter/ephemeral/.plugin_symlinks/${ffi_plugin}/windows'
          if (-not $content.Contains($pluginPath) -or -not $content.Contains($ffiPath)) { throw 'Unexpected generated CMake file' }
          $content = $content.Replace($pluginPath, '"${BOOHTACORD_PLUGIN_SOURCE_${plugin}}/windows"')
          $content = $content.Replace($ffiPath, '"${BOOHTACORD_PLUGIN_SOURCE_${ffi_plugin}}/windows"')
          [System.IO.File]::WriteAllText($cmakeFile, (($sourceLines -join "`n") + "`n" + $content), [System.Text.UTF8Encoding]::new($false))
      - name: Run Flutter tests
        working-directory: desktop
        shell: powershell
        run: |
          flutter test --no-pub
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Test GitHub Android release publisher
        shell: powershell
        run: |
          node --version
          if ($LASTEXITCODE -ne 0) { throw 'Node.js is required for the release publisher tests.' }
          node --test scripts/android_release/publish.test.mjs scripts/android_release/publish_retries.test.mjs scripts/android_release/publish_conflicts.test.mjs
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Analyze Flutter client
        working-directory: desktop
        shell: powershell
        run: |
          flutter analyze --no-pub --no-fatal-infos
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Build Windows release client
        working-directory: desktop
        shell: powershell
        run: |
          flutter build windows --release --no-pub
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Verify complete Windows release directory
        shell: powershell
        run: |
          $release = 'desktop/build/windows/x64/runner/Release'
          foreach ($required in @('boohtacord_desktop.exe', 'flutter_windows.dll', 'libwebrtc.dll', 'data/flutter_assets')) {
            if (-not (Test-Path -LiteralPath (Join-Path $release $required))) {
              throw "Windows release is missing $required"
            }
          }
      - name: Retain Windows build as workflow artifact
        uses: actions/upload-artifact@v4
        with:
          name: BOOHTACORD-windows-x64-${{ github.sha }}
          path: desktop/build/windows/x64/runner/Release/
          if-no-files-found: error
          retention-days: 30
