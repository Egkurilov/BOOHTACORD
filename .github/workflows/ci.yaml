name: CI

on:
  workflow_dispatch:

permissions:
  contents: read

env:
  VITE_PUBLIC_ORIGIN: https://v.bootybay.ru
  WEB_NAMESPACE: shell-load-diagnostic

jobs:
  browser:
    runs-on: [self-hosted, linux, x64, boohtacord-ci-ephemeral]
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        profile: [browser-shell]
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: ${{ runner.os == 'Linux' && '3.12.15' || '3.12.10' }}
      - name: Verify selected Python interpreter
        run: python -m tools.ci.toolchains.runtime python
      - name: Prepare public Node SDK and locked dependency cache inputs
        run: python3 -m tools.ci.toolchains.cache_inputs npm
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version-file: .node-version
          cache: npm
          cache-dependency-path: .out/ci/cache-inputs/npm.json
      - name: Require fresh synthetic browser capture outputs
        env:
          WEB_PROFILE: ${{ matrix.profile }}
        run: python3 -m tools.ci.artifact_policy.run begin web "$WEB_PROFILE"
      - name: Run complete reviewed browser profile
        env:
          WEB_PROFILE: ${{ matrix.profile }}
        run: python3 -m tools.ci.web_suites.run --profile "$WEB_PROFILE"
      - name: Retain mandatory source-bound profile result
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: web-part-shell-load-diagnostic-${{ github.sha }}-${{ github.run_id }}-${{ github.run_attempt }}-${{ matrix.profile }}
          path: .out/ci/web-parts/${{ matrix.profile }}.json
          if-no-files-found: error
          retention-days: 30
      - name: Package verified synthetic browser captures
        if: always()
        env:
          WEB_PROFILE: ${{ matrix.profile }}
          CAPTURE_UPSTREAM_STATUS: ${{ job.status }}
        run: python3 -m tools.ci.artifact_policy.run finish web "$WEB_PROFILE"
      - name: Retain verified synthetic browser evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: web-visual-shell-load-diagnostic-${{ github.sha }}-${{ github.run_id }}-${{ github.run_attempt }}-${{ matrix.profile }}
          path: .out/ci/capture-packages/web-${{ matrix.profile }}/
          if-no-files-found: error
          retention-days: ${{ github.event_name == 'pull_request' && startsWith(github.ref, 'refs/pull/') && job.status == 'success' && 7 || 30 }}

  android:
    runs-on: [self-hosted, linux, x64, boohtacord-ci-ephemeral]
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: ${{ runner.os == 'Linux' && '3.12.15' || '3.12.10' }}
      - name: Verify selected Python interpreter
        run: python -m tools.ci.toolchains.runtime python
      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4
        with:
          distribution: temurin
          java-version: '17.0.20+101'
      - name: Verify selected java SDK
        run: python -m tools.ci.toolchains.runtime java
      - uses: ./.github/actions/flutter-setup
        with:
          channel: stable
          flutter-version: 3.47.7
          cache: true
      - name: Verify both Kotlin modes and build the inspected debug APK
        env:
          FLUTTER_EVIDENCE_NAMESPACE: shell-load-diagnostic
        run: python3 -m tools.ci.flutter_gates.run android
      - name: Upload Android debug APK
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: boohtacord-android-debug-apk-shell-load-diagnostic-${{ github.sha }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: .out/native/android-debug/
          if-no-files-found: error
          retention-days: 30
      - name: Retain mandatory Android profile evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: flutter-part-shell-load-diagnostic-${{ github.sha }}-${{ github.run_id }}-${{ github.run_attempt }}-android
          path: .out/ci/flutter-parts/android.json
          if-no-files-found: error
          retention-days: 30
