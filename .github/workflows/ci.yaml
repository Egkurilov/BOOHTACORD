name: CI

on:
  pull_request:
  push:
    branches: [master]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: checks-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  changes:
    runs-on: ubuntu-24.04
    outputs:
      backend: ${{ steps.select.outputs.backend }}
      web: ${{ steps.select.outputs.web }}
      flutter: ${{ steps.select.outputs.flutter }}
      windows: ${{ steps.select.outputs.windows }}
      server: ${{ steps.select.outputs.server }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - id: select
        run: python3 -m tools.ci.select_changes.run

  contracts:
    uses: ./.github/workflows/ci-contracts.yaml

  backend:
    needs: changes
    if: needs.changes.outputs.backend == 'true'
    uses: ./.github/workflows/ci-backend.yaml

  frontend:
    needs: changes
    if: needs.changes.outputs.web == 'true'
    uses: ./.github/workflows/ci-frontend.yaml

  flutter:
    needs: changes
    if: needs.changes.outputs.flutter == 'true'
    uses: ./.github/workflows/ci-flutter.yaml

  windows:
    needs: changes
    if: needs.changes.outputs.windows == 'true'
    uses: ./.github/workflows/flutter-windows.yaml

  publish:
    if: >-
      always() && github.event_name == 'push' && github.ref == 'refs/heads/master' &&
      needs.changes.outputs.server == 'true' && needs.contracts.result == 'success' &&
      !contains(needs.*.result, 'failure') && !contains(needs.*.result, 'cancelled')
    needs: [changes, contracts, backend, frontend, flutter, windows]
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      packages: write
    outputs:
      api_image: ${{ steps.image-refs.outputs.api_image }}
      web_image: ${{ steps.image-refs.outputs.web_image }}
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Build and push API image
        id: api-image
        uses: docker/build-push-action@v6
        with:
          context: ./backend
          push: true
          sbom: true
          provenance: mode=max
          tags: ghcr.io/egkurilov/voice-platform-api:${{ github.sha }}
      - name: Build and push web image
        id: web-image
        uses: docker/build-push-action@v6
        with:
          context: ./clients/web
          push: true
          sbom: true
          provenance: mode=max
          tags: ghcr.io/egkurilov/voice-platform-web:${{ github.sha }}
      - name: Publish digest-qualified release references
        id: image-refs
        run: |
          echo "api_image=ghcr.io/egkurilov/voice-platform-api@${{ steps.api-image.outputs.digest }}" >> "$GITHUB_OUTPUT"
          echo "web_image=ghcr.io/egkurilov/voice-platform-web@${{ steps.web-image.outputs.digest }}" >> "$GITHUB_OUTPUT"
