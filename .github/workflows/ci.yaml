name: Runner dual Android 5632MiB diagnostic
'on':
  workflow_dispatch: {}
permissions:
  contents: read
concurrency:
  group: runner-memory5632-${{ github.ref }}
  cancel-in-progress: true
jobs:
  android-one:
    runs-on:
    - self-hosted
    - linux
    - x64
    - boohtacord-ci-ephemeral
    timeout-minutes: 30
    steps:
    - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      with:
        persist-credentials: false
    - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
      with:
        python-version: ${{ runner.os == 'Linux' && '3.12.15' || '3.12.10' }}
    - name: Verify selected Python interpreter
      run: python -m tools.ci.toolchains.runtime python
    - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3
      with:
        distribution: temurin
        java-version: 17.0.20+101
    - name: Verify selected java SDK
      run: python -m tools.ci.toolchains.runtime java
    - uses: ./.github/actions/flutter-setup
      with:
        channel: stable
        flutter-version: 3.47.7
        cache: true
    - name: Verify both Kotlin modes and build the inspected debug APK
      env:
        FLUTTER_EVIDENCE_NAMESPACE: memory-one
      run: python3 -m tools.ci.flutter_gates.run android
    - name: Upload Android debug APK
      uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
      with:
        name: boohtacord-android-debug-apk-memory-one-${{ github.sha }}-${{ github.run_id }}-${{ github.run_attempt }}
        path: .out/native/android-debug/
        if-no-files-found: error
        retention-days: 30
    - name: Retain mandatory Android profile evidence
      if: always()
      uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
      with:
        name: flutter-part-memory-one-${{ github.sha }}-${{ github.run_id }}-${{ github.run_attempt }}-android
        path: .out/ci/flutter-parts/android.json
        if-no-files-found: error
        retention-days: 30
  android-two:
    runs-on:
    - self-hosted
    - linux
    - x64
    - boohtacord-ci-ephemeral
    timeout-minutes: 30
    steps:
    - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      with:
        persist-credentials: false
    - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
      with:
        python-version: ${{ runner.os == 'Linux' && '3.12.15' || '3.12.10' }}
    - name: Verify selected Python interpreter
      run: python -m tools.ci.toolchains.runtime python
    - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3
      with:
        distribution: temurin
        java-version: 17.0.20+101
    - name: Verify selected java SDK
      run: python -m tools.ci.toolchains.runtime java
    - uses: ./.github/actions/flutter-setup
      with:
        channel: stable
        flutter-version: 3.47.7
        cache: true
    - name: Verify both Kotlin modes and build the inspected debug APK
      env:
        FLUTTER_EVIDENCE_NAMESPACE: memory-two
      run: python3 -m tools.ci.flutter_gates.run android
    - name: Upload Android debug APK
      uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
      with:
        name: boohtacord-android-debug-apk-memory-two-${{ github.sha }}-${{ github.run_id }}-${{ github.run_attempt }}
        path: .out/native/android-debug/
        if-no-files-found: error
        retention-days: 30
    - name: Retain mandatory Android profile evidence
      if: always()
      uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
      with:
        name: flutter-part-memory-two-${{ github.sha }}-${{ github.run_id }}-${{ github.run_attempt }}-android
        path: .out/ci/flutter-parts/android.json
        if-no-files-found: error
        retention-days: 30
