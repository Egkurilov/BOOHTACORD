name: CI frontend

on:
  workflow_call:
    inputs:
      release_receipt:
        type: boolean
        default: false

permissions:
  contents: read

jobs:
  frontend:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .node-version
          cache: npm
          cache-dependency-path: clients/web/package-lock.json
      - name: Install locked browser runtime
        working-directory: clients/web
        run: |
          npm ci
          npx playwright install --with-deps chromium
      - name: Test and build Vue client
        run: python3 -m tools.ci.receipts.run web
      - name: Retain source-bound gate receipt
        if: inputs.release_receipt
        uses: actions/upload-artifact@v4
        with:
          name: check-web-${{ github.sha }}
          path: .out/checks/web.json
          if-no-files-found: error
          retention-days: 30
