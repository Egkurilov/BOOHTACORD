name: Deploy production

on:
  push:
    branches: [master]
    paths:
      - 'backend/**'
      - 'clients/web/**'
      - 'contracts/**'
      - 'docker/**'
      - 'scripts/**'
      - 'compose.yaml'
      - '.env.example'
      - '.github/workflows/deploy-production.yaml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: v-bootybay-production
  cancel-in-progress: false

jobs:
  backend:
    runs-on: [self-hosted, linux, x64, boohtacord-hetzner-db]
    timeout-minutes: 15
    services:
      postgres:
        image: postgres:17.6-alpine
        env:
          POSTGRES_DB: voice_platform_test
          POSTGRES_USER: voice_platform_test
          POSTGRES_PASSWORD: test-only-password
        ports: ['15435:5432']
        options: >-
          --health-cmd "pg_isready -U voice_platform_test -d voice_platform_test"
          --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      VOICE_PLATFORM_TEST_DATABASE_URL: postgres://voice_platform_test:test-only-password@127.0.0.1:15435/voice_platform_test?sslmode=disable
      TEST_DATABASE_URL: postgres://voice_platform_test:test-only-password@127.0.0.1:15435/voice_platform_test?sslmode=disable
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: backend/go.mod
          cache: false
      - name: Test, vet and build Go API
        run: python3 -m tools.ci.native.backend

  frontend:
    runs-on: [self-hosted, linux, x64, boohtacord-hetzner]
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .node-version
          cache: npm
          cache-dependency-path: clients/web/package-lock.json
      - name: Test and build Vue client
        run: python3 -m tools.ci.native.web

  release_guard:
    runs-on: [self-hosted, linux, x64, boohtacord-hetzner]
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - name: Verify contracts, traceability, images and release guards
        shell: bash
        run: bash scripts/verify-release-guards.sh

  deploy:
    if: ${{ github.ref_name == 'master' }}
    needs: [backend, frontend, release_guard]
    environment: production
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      DEPLOY_SERVER_IP: 176.108.242.211
      DEPLOY_SSH_PRIVATE_KEY: ${{ secrets.DEPLOY_SSH_PRIVATE_KEY }}
      SSH_USER: shaneque
    steps:
      - uses: actions/checkout@v4
      - name: Inspect Docker storage before guarded release
        shell: bash
        run: bash scripts/qa08_capacity/prepare_host_storage.sh
      - name: Recover attachment filesystem headroom from unused Docker data
        shell: bash
        run: |
          set -euo pipefail
          remote="${SSH_USER}@${DEPLOY_SERVER_IP}"
          ssh_options=(-i "$HOME/.ssh/id_deploy" -o BatchMode=yes -o StrictHostKeyChecking=yes -o UserKnownHostsFile="$HOME/.ssh/known_hosts")
          ssh "${ssh_options[@]}" "$remote" 'sudo -n bash -s' < scripts/qa08_capacity/reclaim_deploy_headroom.sh

      - name: Package the checked-out source
        id: source
        shell: bash
        run: |
          set -euo pipefail
          git_sha="$(git rev-parse HEAD)"
          [[ "$git_sha" =~ ^[0-9a-f]{40}$ ]]
          archive="${RUNNER_TEMP:?}/voice-platform-${git_sha}.tar.gz"
          git archive --format=tar HEAD | gzip -n > "$archive"
          printf 'git_sha=%s\n' "$git_sha" >> "$GITHUB_OUTPUT"
          printf 'archive=%s\n' "$archive" >> "$GITHUB_OUTPUT"
          printf 'archive_sha256=%s\n' "$(sha256sum "$archive" | awk '{print $1}')" >> "$GITHUB_OUTPUT"

      - name: Transfer, build and perform guarded release
        shell: bash
        env:
          ARCHIVE: ${{ steps.source.outputs.archive }}
          ARCHIVE_SHA256: ${{ steps.source.outputs.archive_sha256 }}
          GIT_SHA: ${{ steps.source.outputs.git_sha }}
        run: bash scripts/qa11_release/transfer_release.sh
      - name: Audit live attachment headroom after rollout
        shell: bash
        run: |
          set -euo pipefail
          git_sha="$(git rev-parse HEAD)"
          remote="${SSH_USER}@${DEPLOY_SERVER_IP}"
          ssh_options=(-i ~/.ssh/id_deploy -o BatchMode=yes -o StrictHostKeyChecking=yes -o UserKnownHostsFile="$HOME/.ssh/known_hosts")
          ssh "${ssh_options[@]}" "$remote" bash -s -- "$git_sha" < scripts/audit-attachment-volume.sh
