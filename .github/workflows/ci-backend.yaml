name: CI backend

on:
  workflow_call:
    inputs:
      release_receipt:
        type: boolean
        default: false

permissions:
  contents: read

jobs:
  backend:
    runs-on: ubuntu-24.04
    services:
      postgres:
        image: postgres:17.6-alpine
        env:
          POSTGRES_DB: voice_platform_test
          POSTGRES_USER: voice_platform_test
          POSTGRES_PASSWORD: test-only-password
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U voice_platform_test -d voice_platform_test"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      VOICE_PLATFORM_TEST_DATABASE_URL: postgres://voice_platform_test:test-only-password@127.0.0.1:5432/voice_platform_test?sslmode=disable
      TEST_DATABASE_URL: postgres://voice_platform_test:test-only-password@127.0.0.1:5432/voice_platform_test?sslmode=disable
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: backend/go.mod
          cache-dependency-path: backend/go.sum
      - name: Test, vet and build Go API
        run: python3 -m tools.ci.receipts.run backend
      - name: Exercise owned real API load smoke
        timeout-minutes: 6
        run: python3 -m tools.load.controller.run --accounts 2 --seconds 20 --profile normal
      - name: Retain sanitized load smoke evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: backend-load-smoke-${{ github.sha }}
          path: .out/backend-load/normal/report.json
          if-no-files-found: error
          retention-days: 14
      - name: Retain source-bound gate receipt
        if: inputs.release_receipt
        uses: actions/upload-artifact@v4
        with:
          name: check-backend-${{ github.sha }}
          path: .out/checks/backend.json
          if-no-files-found: error
          retention-days: 30
