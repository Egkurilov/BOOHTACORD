name: CI

on:
  pull_request:
  push:
    branches: [main, master]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  contracts:
    uses: ./.github/workflows/ci-contracts.yml

  backend:
    uses: ./.github/workflows/ci-backend.yml

  frontend:
    uses: ./.github/workflows/ci-frontend.yml

  flutter-windows:
    uses: ./.github/workflows/ci-flutter-windows.yml

  publish:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: [contracts, backend, frontend, flutter-windows]
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      packages: write
    outputs:
      api_image: ${{ steps.image-refs.outputs.api_image }}
      web_image: ${{ steps.image-refs.outputs.web_image }}
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Build and push API image
        id: api-image
        uses: docker/build-push-action@v6
        with:
          context: ./backend
          push: true
          sbom: true
          provenance: mode=max
          tags: ghcr.io/${{ github.repository_owner }}/voice-platform-api:${{ github.sha }}
      - name: Build and push web image
        id: web-image
        uses: docker/build-push-action@v6
        with:
          context: ./frontend
          push: true
          sbom: true
          provenance: mode=max
          tags: ghcr.io/${{ github.repository_owner }}/voice-platform-web:${{ github.sha }}
      - name: Publish digest-qualified release references
        id: image-refs
        run: |
          echo "api_image=ghcr.io/${{ github.repository_owner }}/voice-platform-api@${{ steps.api-image.outputs.digest }}" >> "$GITHUB_OUTPUT"
          echo "web_image=ghcr.io/${{ github.repository_owner }}/voice-platform-web@${{ steps.web-image.outputs.digest }}" >> "$GITHUB_OUTPUT"
