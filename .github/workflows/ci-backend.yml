name: CI backend

on:
  workflow_call:

permissions:
  contents: read

jobs:
  backend:
    runs-on: ubuntu-24.04
    services:
      postgres:
        image: postgres:17.6-alpine
        env:
          POSTGRES_DB: voice_platform_test
          POSTGRES_USER: voice_platform_test
          POSTGRES_PASSWORD: test-only-password
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U voice_platform_test -d voice_platform_test"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      VOICE_PLATFORM_TEST_DATABASE_URL: postgres://voice_platform_test:test-only-password@127.0.0.1:5432/voice_platform_test?sslmode=disable
      TEST_DATABASE_URL: postgres://voice_platform_test:test-only-password@127.0.0.1:5432/voice_platform_test?sslmode=disable
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: backend/go.mod
          cache-dependency-path: backend/go.sum
      - name: Test, vet and build Go API
        working-directory: backend
        run: |
          set -euo pipefail
          test_events="$(mktemp "${RUNNER_TEMP:-/tmp}/backend-test-events.XXXXXX")"
          test_status=0
          go test -json -count=1 ./... > "$test_events" || test_status=$?
          python3 ../scripts/verify-go-test-events.py "$test_events"
          test "$test_status" -eq 0
          go vet ./...
          go build -o /tmp/voice-platform-api ./cmd/api
